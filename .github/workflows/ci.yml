name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: settlement
          POSTGRES_PASSWORD: settlement-ci
          POSTGRES_DB: settlement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settlement -d settlement"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest -rs
        env:
          DATABASE_URL: postgresql://settlement:settlement-ci@localhost:5432/settlement

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Docker image
        run: docker build -t settlement-app:ci .
